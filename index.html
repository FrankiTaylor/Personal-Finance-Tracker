<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="setup.html">Setup Accounts</a>
        <a href="overview.html">Overview</a>
    </nav>

    <div class="container">
        <h1>Load CSV</h1>
        <div class="input-row">
            <label for="accountSelect">Account:</label>
            <select id="accountSelect"></select>
            <label for="inputName">Name:</label>
            <input type="text" id="inputName" placeholder="Enter a name">
            <input type="file" id="excelFileInput" accept=".xlsx, .xls">
        </div>
        <div id="dataDisplay" class="data-display"></div>
    </div>

    <!-- Scripts at the end of body for faster page load -->
    <script src="xlsx.full.min.js"></script>
    <script src="script.js"></script>
    <script>
    // Call populateAccounts when the page loads
        window.onload = function() {
            populateAccounts();
        };
    </script>
</body>
</html>
