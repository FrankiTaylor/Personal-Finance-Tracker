<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="setup.html">Setup Accounts</a>
        <a href="overview.html">Overview</a>
    </nav>

    <div class="container">
        <h1>Setup Accounts</h1>
        <p>Enter account information for CSV data to be saved under.</p>
    </div>

    <div class="input-row">
        <label for="inputName" style="margin-left: 20px;">Name:</label>
        <input type="text" id="inputName" placeholder="Enter a name">

        <label for="categorySelect" style="margin-left: 20px;">Categories:</label>
        <select id="categorySelect"></select>

        <button onclick="addAccount()">Add Account</button>

        <button onclick="deleteCategory()" id="deleteCategoryBtn" style="margin-left: 10px;">Delete Selected</button>
    </div>

    <button onclick="clearLocalStorage()" style="margin-left: 10px;">Clear Local Storage</button>

    <!-- Scripts at the end of body for faster page load -->
    <script src="xlsx.full.min.js"></script>
    <script src="script.js"></script>
    <script>
        // Call populateCategories when the page loads
        window.onload = function() {
            populateCategories();
        };
    </script>
</body>
</html>
